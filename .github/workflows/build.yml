name: "Main / Pull requests build"

on:
    pull_request:
        paths-ignore:
            - '**.txt'
            - 'LICENSE'
            - 'docs/**'
        branches:
            - main
    push:
        branches:
            - main
    workflow_dispatch:

# Self-hosted runners persist between jobs. WebGoat's integration tests bind
# fixed ports and leave state in ${java.io.tmpdir}/webgoat_<port>, so overlapping
# runs on the same machine collide.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    pre-commit:
        name: Pre-commit check
        runs-on: [self-hosted]
        steps:
            -   name: Checkout git repository
                uses: actions/checkout@v7
            -   name: Setup python
                uses: actions/setup-python@v6
                with:
                    python-version: "3.9"
            -   name: Setup Java
                uses: ./.github/actions/java-setup
                with:
                    cache: ""
            -   name: Pre-commit checks
                uses: pre-commit/action@v3.0.1
            -   name: pre-commit-c-lite
                uses: pre-commit-ci/lite-action@v1.1.0
                if: always()

    build:
        name: Build and Nexus repo
        runs-on: [self-hosted]
        needs: [ pre-commit ]
        permissions:
            contents: read
            security-events: write
        steps:
            # ---------- 1. Set up build environment ----------
            -   uses: actions/checkout@v7
            -   name: Set up JDK
                uses: ./.github/actions/java-setup
                with:
                    cache: 'maven'
            -   name: Verify Java and Maven
                run: |
                    echo "=== JAVA ==="
                    java -version

                    echo "=== JAVAC ==="
                    javac -version

                    echo "=== JAVA_HOME ==="
                    echo "$JAVA_HOME"

                    echo "=== JAVA LOCATION ==="
                    which java
                    which javac

                    echo "=== MAVEN ==="
                    ./mvnw -version

            # The wrapper pins the Maven version, so the runner needs no Maven
            # installed. mvnw is committed 100755, but re-assert it here in case
            # a runner's checkout drops the mode -- it persists for later steps.
            -   name: Make Maven wrapper executable
                run: chmod +x ./mvnw

            # ---------- 2. Nexus Repository credentials ----------
            # ./mvnw deploy authenticates by <server><id>, so the ids used in
            # altDeploymentRepository below must exist in settings.xml.
            # ${env.*} is resolved by Maven at runtime -- no secrets on disk.
            -   name: Create Maven settings
                env:
                    NEXUS_URL: ${{ secrets.NEXUS_URL }}
                run: |
                    cat > "$RUNNER_TEMP/maven-settings.xml" <<'EOF'
                    <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
                        <servers>

                        <server>
                            <id>nexus</id>
                            <username>${env.NEXUS_USERNAME}</username>
                            <password>${env.NEXUS_PASSWORD}</password>
                        </server>

                        <server>
                            <id>nexus-snapshots</id>
                            <username>${env.NEXUS_USERNAME}</username>
                            <password>${env.NEXUS_PASSWORD}</password>
                        </server>

                        <server>
                            <id>nexus-public</id>
                            <username>${env.NEXUS_USERNAME}</username>
                            <password>${env.NEXUS_PASSWORD}</password>
                        </server>

                        </servers>

                        <mirrors>
                        <mirror>
                            <id>nexus-public</id>
                            <mirrorOf>*</mirrorOf>
                            <url>${env.NEXUS_URL}/repository/maven-central/</url>
                        </mirror>
                        </mirrors>

                    </settings>
                    EOF

                    echo "Maven settings created at:"
                    echo "$RUNNER_TEMP/maven-settings.xml"


            # Nexus Firewall enforcement point. Routing every dependency through
            # the Nexus proxy means quarantined components fail resolution during
            # the build below -- there is no separate "firewall" action to call.
            -   name: Build with Maven
                env:
                    NEXUS_URL: ${{ secrets.NEXUS_URL }}
                    NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
                    NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
                run: |
                    ./mvnw \
                    -s "$RUNNER_TEMP/maven-settings.xml" \
                    --no-transfer-progress \
                    verify \
                    -DskipITs

            -   name: Sonatype Lifecycle scan
                uses: sonatype/actions/evaluate@v1
                with:
                    iq-server-url: ${{ secrets.IQ_SERVER_URL }}
                    username: ${{ secrets.IQ_USERNAME }}
                    password: ${{ secrets.IQ_PASSWORD }}
                    application-id: WebGoat__renneang-95
                    scan-targets: pom.xml
                    stage: build

            -   name: Display Lifecycle report URL
                run: |
                    echo "Scan ID:"
                    echo "${{ steps.lifecycle.outputs.scan-id }}"

                    echo "Lifecycle Report:"
                    echo "${{ steps.lifecycle.outputs.report-url }}"

            -   name: Verify Java and Maven 2
                run: |
                    echo "=== JAVA ==="
                    java -version

                    echo "=== JAVAC ==="
                    javac -version

                    echo "=== JAVA_HOME ==="
                    echo "$JAVA_HOME"

                    echo "=== JAVA LOCATION ==="
                    which java
                    which javac

                    echo "=== MAVEN ==="
                    ./mvnw -version

            -   name: Restore JDK 25 after Lifecycle scan
                uses: ./.github/actions/java-setup
                with:
                    cache: 'maven'

            -   name: Verify Nexus credentials and Maven environment
                env:
                    NEXUS_URL: ${{ secrets.NEXUS_URL }}
                    NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
                    NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
                run: |
                    echo "NEXUS_URL=$NEXUS_URL"
                    test -n "$NEXUS_USERNAME" && echo "NEXUS_USERNAME is set"
                    test -n "$NEXUS_PASSWORD" && echo "NEXUS_PASSWORD is set"

                    echo "=== Java ==="
                    java -version
                    javac -version

                    echo "=== Maven ==="
                    ./mvnw -version

                    echo "=== Maven settings ==="
                    cat "$RUNNER_TEMP/maven-settings.xml"

                    echo "=== Nexus authentication ==="
                    curl -sS \
                    -u "$NEXUS_USERNAME:$NEXUS_PASSWORD" \
                    -o /dev/null \
                    -w "HTTP Status: %{http_code}\n" \
                    "$NEXUS_URL/service/rest/v1/status"

            # ---------- 3. Nexus Repository ----------
            # Only publish from main -- PR builds stop after verify.
            -   name: Publish to Nexus Repository
                if: github.event_name == 'push' && github.ref == 'refs/heads/main'
                env:
                    NEXUS_URL: ${{ secrets.NEXUS_URL }}
                    NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
                    NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
                run: |
                    ./mvnw \
                    -s "$RUNNER_TEMP/maven-settings.xml" \
                    --no-transfer-progress \
                    deploy \
                    -DskipTests \
                    -DaltSnapshotDeploymentRepository="nexus-snapshots::${NEXUS_URL}/repository/maven-snapshots/" \
                    -DaltReleaseDeploymentRepository="nexus::${NEXUS_URL}/repository/maven-releases/"

            # Resolve the exact coordinates that landed in Nexus. For SNAPSHOTs
            # the deployed filename carries a timestamp, not "-SNAPSHOT", so a
            # later deploy job cannot reconstruct the URL from the pom alone.
            -   name: Capture published artifact coordinates
                if: github.event_name == 'push' && github.ref == 'refs/heads/main'
                id: artifact
                env:
                    NEXUS_URL: ${{ secrets.NEXUS_URL }}
                    NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
                    NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
                run: |
                    set -euo pipefail

                    GROUP_ID=$(./mvnw -q -DforceStdout help:evaluate -Dexpression=project.groupId)
                    ARTIFACT_ID=$(./mvnw -q -DforceStdout help:evaluate -Dexpression=project.artifactId)
                    BASE_VERSION=$(./mvnw -q -DforceStdout help:evaluate -Dexpression=project.version)
                    GROUP_PATH="${GROUP_ID//.//}"

                    if [[ "$BASE_VERSION" == *-SNAPSHOT ]]; then
                      NEXUS_REPO=maven-snapshots
                      curl -sf -u "$NEXUS_USERNAME:$NEXUS_PASSWORD" \
                        "${NEXUS_URL}/repository/${NEXUS_REPO}/${GROUP_PATH}/${ARTIFACT_ID}/${BASE_VERSION}/maven-metadata.xml" \
                        -o /tmp/maven-metadata.xml
                      EXACT_VERSION=$(grep -oP '(?<=<value>)[^<]+(?=</value>)' \
                        /tmp/maven-metadata.xml | tail -1)
                    else
                      NEXUS_REPO=maven-releases
                      EXACT_VERSION="$BASE_VERSION"
                    fi

                    JAR_URL="${NEXUS_URL}/repository/${NEXUS_REPO}/${GROUP_PATH}/${ARTIFACT_ID}/${BASE_VERSION}/${ARTIFACT_ID}-${EXACT_VERSION}.jar"

                    {
                      echo "GROUP_ID=$GROUP_ID"
                      echo "ARTIFACT_ID=$ARTIFACT_ID"
                      echo "BASE_VERSION=$BASE_VERSION"
                      echo "EXACT_VERSION=$EXACT_VERSION"
                      echo "NEXUS_REPO=$NEXUS_REPO"
                      echo "GIT_COMMIT=$(git rev-parse --short HEAD)"
                      echo "BUILD_NUMBER=${{ github.run_number }}"
                    } > build-info.properties

                    cat build-info.properties
                    echo "Published: $JAR_URL"

                    {
                      echo "exact_version=$EXACT_VERSION"
                      echo "nexus_repo=$NEXUS_REPO"
                      echo "jar_url=$JAR_URL"
                    } >> "$GITHUB_OUTPUT"

            -   name: Upload build-info
                if: github.event_name == 'push' && github.ref == 'refs/heads/main'
                uses: actions/upload-artifact@v7
                with:
                    name: build-info
                    path: build-info.properties
                    retention-days: 5
